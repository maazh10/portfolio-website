name = "portfolio-image-cdn"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "portfolio-website"

[images]
binding = "IMAGES"

[cache]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://maazh.tech"

# R2 event notifications → this queue rebuilds the photography manifest on upload/delete.
# Setup (once):
#   npx wrangler queues create photography-r2-events
#   npx wrangler r2 bucket notification create portfolio-website \
#     --event-types object-create object-delete \
#     --prefix "photography/" \
#     --queue photography-r2-events
[[queues.consumers]]
queue = "photography-r2-events"
max_batch_size = 10
max_batch_timeout = 30
